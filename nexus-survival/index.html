<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Survival</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071019;color:#eef6ff;font-family:Arial,"Noto Sans KR",sans-serif;overflow:hidden}#wrap{position:relative;width:100%;height:100%}canvas{width:100%;height:100%;display:block;background:#0b1720}.panel,.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,14,.9)}.box{width:min(900px,92vw);background:#101c2a;border:1px solid #35506b;border-radius:16px;padding:24px;box-shadow:0 20px 80px #0008}.title{font-size:42px;font-weight:900;margin:0 0 4px}.sub{color:#9db0c5;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.smallgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.card,.btn{border:1px solid #39526c;background:#162639;color:#eef6ff;border-radius:10px;padding:14px;cursor:pointer}.card.sel,.btn.sel{outline:2px solid #65ddff;background:#15364a}.card b{display:block;font-size:18px}.card small{color:#a9b9c9}.start{margin-top:20px;width:100%;font-size:18px;font-weight:800;background:#63dcf6;color:#06202a}.hidden{display:none!important}#hud{position:absolute;inset:0;pointer-events:none}.hudbox{position:absolute;background:#08121dcc;border:1px solid #31485e;border-radius:8px;padding:9px 11px}.left{left:12px;top:12px}.bottom{left:12px;bottom:12px;width:310px}.top{left:50%;top:12px;transform:translateX(-50%);width:390px}.bar{height:12px;background:#243344;border-radius:4px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#61dfbe}.xp{background:#5cc5ff}.hp{background:#ef6871}.boss{background:#ca5b7d}.row{display:flex;justify-content:space-between;gap:12px}.choicebox{width:min(960px,94vw)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{min-height:170px}.choice h3{margin:8px 0}.nexus{margin-top:14px;width:100%;background:#32214b}.toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.smallgrid{grid-template-columns:repeat(3,1fr)}.title{font-size:30px}}</style></head><body><div id="wrap"><canvas id="c" width="1280" height="720"></canvas><div id="menu" class="panel"><div class="box"><div class="title">NEXUS SURVIVAL</div><div class="sub">넥서스를 지키며 성장하는 서바이벌 디펜스 프로토타입</div><div id="classes" class="grid"></div><div id="diffs" class="smallgrid"></div><button id="start" class="btn start">게임 시작</button><div style="margin-top:12px;color:#8fa4b8;font-size:13px">WASD 이동 · 자동 공격 · B 보스 즉시 소환 · 레벨업 시 3택1 또는 넥서스 투자</div></div></div><div id="hud" class="hidden"><div class="hudbox left"><div id="stage">STAGE 1</div><div id="time">00:00</div></div><div class="hudbox top"><div class="row"><b>NEXUS</b><span id="ntext"></span></div><div class="bar"><div id="nbar" class="fill"></div></div><div id="core" style="font-size:11px;color:#b9c8d7;margin-top:4px"></div><div id="bosshud" class="hidden"><div class="row"><b id="bname"></b><span id="btext"></span></div><div class="bar"><div id="bbar" class="fill boss"></div></div></div></div><div class="hudbox bottom"><div class="row"><b id="pname"></b><span id="ptext"></span></div><div class="bar"><div id="pbar" class="fill hp"></div></div><div class="bar"><div id="xbar" class="fill xp"></div></div><div id="lvl" style="font-size:12px;margin-top:4px"></div></div></div><div id="levelModal" class="modal hidden"><div class="box choicebox"><h2 style="text-align:center">LEVEL UP</h2><div id="choices" class="choices"></div><button id="nexusBtn" class="btn nexus">이번 성장을 넥서스에 투자 · CORE +100</button></div></div><div id="chestModal" class="modal hidden"><div class="box" style="max-width:520px;text-align:center"><div style="font-size:64px">▣</div><h2>BOSS TREASURE</h2><div id="reward" style="font-size:18px;margin:20px 0"></div><button id="rewardBtn" class="btn start">획득하고 다음 스테이지</button></div></div><div id="toast" class="toast"></div></div><script>const C={warrior:{n:'전사',d:'근접 광역·탱커',hp:190,spd:220,dmg:34,rate:.62,rng:95,col:'#ff916d'},archer:{n:'궁수',d:'원거리·치명타',hp:125,spd:250,dmg:24,rate:.38,rng:420,col:'#8ee58c'},mage:{n:'마법사',d:'광역 마법·제어',hp:110,spd:230,dmg:29,rate:.58,rng:350,col:'#9fb3ff'},priest:{n:'성직자',d:'회복·신성 공격',hp:140,spd:225,dmg:23,rate:.50,rng:330,col:'#ffe08b'}};const DF={EASY:[.75,.8,.85,1.25],NORMAL:[1,1,1,1],HARD:[1.25,1.2,1.15,1],NIGHTMARE:[1.55,1.45,1.3,.95],HELL:[1.9,1.75,1.5,.9]};const ST=[['붕괴한 평원','오우거 대장','#27442e'],['저주받은 늪','역병의 마녀','#30432b'],['얼어붙은 폐허','빙결의 거인','#33566d'],['지옥의 요새','화염 군주','#5b2724'],['공허의 균열','심연의 군주','#382553']];const skills={warrior:['회전베기','지진강타','검기','방패 돌진','출혈 칼날','반격','투척 도끼','사슬 갈고리','광폭화','철벽'],archer:['다중 사격','관통 화살','화살비','독화살','저격','도탄 화살','폭발 화살','냉기 화살','속사','사냥꾼의 표식'],mage:['화염구','체인 라이트닝','얼음 폭발','운석','마력 구체','마력탄','비전 광선','눈보라','블랙홀','시간 왜곡'],priest:['신성한 빛','치유의 파동','신성 장판','천벌','보호막','신성 사슬','퇴마 구체','수호천사','기도','성광 폭발']};const common=['공격력 +12%','공격속도 +10%','사거리 +12%','최대체력 +12%','이동속도 +10%','치명타 확률 +8%','획득 범위 +25%','체력 재생'];let cls='warrior',diff='NORMAL',g=null,keys={},last=performance.now(),state='menu';const $=x=>document.getElementById(x),cv=$('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;function menu(){let a=$('classes');a.innerHTML='';Object.entries(C).forEach(([k,v])=>{let b=document.createElement('button');b.className='card '+(k===cls?'sel':'');b.innerHTML='<b>'+v.n+'</b><small>'+v.d+'</small>';b.onclick=()=>{cls=k;menu()};a.appendChild(b)});let d=$('diffs');d.innerHTML='';Object.keys(DF).forEach(k=>{let b=document.createElement('button');b.className='btn '+(k===diff?'sel':'');b.textContent=k;b.onclick=()=>{diff=k;menu()};d.appendChild(b)})}menu();function toast(t){$('toast').textContent=t;setTimeout(()=>{if($('toast').textContent===t)$('toast').textContent=''},1400)}function start(){let c=C[cls],f=DF[diff];g={t:0,stage:0,kills:0,boss:false,spawn:0,p:{x:640,y:470,hp:c.hp,max:c.hp,spd:c.spd,dmg:c.dmg,rate:c.rate,rng:c.rng,at:0,l:1,xp:0,nxp:35,crit:.05,regen:0,skills:{}},n:{x:640,y:360,hp:2400*f[3],max:2400*f[3],lv:1,core:0,next:100,turret:0,regen:0},e:[],q:[],gem:[]};$('menu').classList.add('hidden');$('hud').classList.remove('hidden');state='play';toast('NEXUS를 지키세요')}$('start').onclick=start;function spawn(b=false){let f=DF[diff],a=Math.random()*Math.PI*2,r=500+Math.random()*220,x=g.n.x+Math.cos(a)*r,y=g.n.y+Math.sin(a)*r;if(b){g.e.push({x,y,r:38,hp:(4200+g.stage*2600)*f[0],max:(4200+g.stage*2600)*f[0],spd:55,dmg:(25+g.stage*10)*f[1],boss:true,cd:0});g.boss=true;$('bosshud').classList.remove('hidden');$('bname').textContent=ST[g.stage][1];toast('BOSS · '+ST[g.stage][1]);return}g.e.push({x,y,r:11+Math.random()*6,hp:(44+Math.random()*38)*(1+g.stage*.35)*f[0],max:80,spd:75+Math.random()*60,dmg:(7+g.stage*4)*f[1],boss:false,cd:0})}function proj(x,y,tx,ty,dmg){let a=Math.atan2(ty-y,tx-x);g.q.push({x,y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,d:dmg,life:1.3})}function nearest(){let p=g.p,b=null,bd=p.rng*p.rng;for(let e of g.e){let d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<bd){bd=d;b=e}}return b}function hit(e,d){let cr=Math.random()<g.p.crit;if(cr)d*=1.7;e.hp-=d;if(e.hp<=0){let i=g.e.indexOf(e);if(i>=0)g.e.splice(i,1);g.kills++;g.gem.push({x:e.x,y:e.y,v:e.boss?120:6});if(e.boss){g.boss=false;$('bosshud').classList.add('hidden');openChest()}}}function gain(v){let p=g.p;p.xp+=v;while(p.xp>=p.nxp){p.xp-=p.nxp;p.l++;p.nxp=Math.floor(35*Math.pow(p.l,1.18));levelUp();break}}function levelUp(){state='level';$('levelModal').classList.remove('hidden');let box=$('choices');box.innerHTML='';let pool=[...skills[cls].map(x=>({n:x,t:'직업 스킬'})),...common.map(x=>({n:x,t:'공통 패시브'}))].sort(()=>Math.random()-.5).slice(0,3);pool.forEach(o=>{let b=document.createElement('button');b.className='card choice';let lv=g.p.skills[o.n]||0;b.innerHTML='<small>'+o.t+'</small><h3>'+o.n+'</h3><div>현재 Lv.'+lv+'</div><p>선택하면 해당 능력이 강화됩니다.</p>';b.onclick=()=>choose(o.n);box.appendChild(b)})}function choose(n){g.p.skills[n]=(g.p.skills[n]||0)+1;if(skills[cls].includes(n)){g.p.dmg*=1.07;g.p.rate*=.97}else{if(n.startsWith('공격력'))g.p.dmg*=1.12;else if(n.startsWith('공격속도'))g.p.rate*=.9;else if(n.startsWith('사거리'))g.p.rng*=1.12;else if(n.startsWith('최대체력')){g.p.max*=1.12;g.p.hp=g.p.max}else if(n.startsWith('이동속도'))g.p.spd*=1.1;else if(n.startsWith('치명타'))g.p.crit+=.08;else if(n.startsWith('체력 재생'))g.p.regen+=.006}$('levelModal').classList.add('hidden');state='play';toast(n+' 강화')}$('nexusBtn').onclick=()=>{$('levelModal').classList.add('hidden');g.n.core+=100;if(g.n.core>=g.n.next){g.n.core-=g.n.next;g.n.lv++;g.n.next=Math.floor(100+(g.n.lv-1)*50);let r=Math.random();if(r<.34){g.n.max*=1.18;g.n.hp=Math.min(g.n.max,g.n.hp+g.n.max*.25);toast('NEXUS Lv.'+g.n.lv+' · 최대 체력 증가')}else if(r<.67){g.n.turret++;toast('NEXUS Lv.'+g.n.lv+' · 포탑 강화')}else{g.n.regen+=.0025;toast('NEXUS Lv.'+g.n.lv+' · 자동 복구 강화')}}state='play'};function openChest(){state='chest';$('chestModal').classList.remove('hidden');let list=skills[cls],name=list[(Math.random()*list.length)|0];$('reward').textContent=C[cls].n+' 전용 보상 · '+name+' 강화'}$('rewardBtn').onclick=()=>{$('chestModal').classList.add('hidden');if(g.stage>=4){alert('VICTORY · 최종 보스를 처치했습니다');location.reload();return}g.stage++;g.t=0;g.e=[];g.q=[];g.gem=[];g.n.hp=Math.min(g.n.max,g.n.hp+g.n.max*.2);state='play';toast('STAGE '+(g.stage+1)+' · '+ST[g.stage][0])};function update(dt){if(state!=='play'||!g)return;dt=Math.min(dt,.033);g.t+=dt;let p=g.p,n=g.n,f=DF[diff],dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0),l=Math.hypot(dx,dy)||1;p.x=Math.max(20,Math.min(W-20,p.x+dx/l*p.spd*dt));p.y=Math.max(20,Math.min(H-20,p.y+dy/l*p.spd*dt));p.hp=Math.min(p.max,p.hp+p.max*p.regen*dt);n.hp=Math.min(n.max,n.hp+n.max*n.regen*dt);g.spawn-=dt;if(g.spawn<=0&&!g.boss){spawn();g.spawn=Math.max(.09,.7/(f[2]*(1+g.stage*.22)+g.t/160))}if(g.t>70&&!g.boss)spawn(true);p.at-=dt;if(p.at<=0){let e=nearest();if(e){proj(p.x,p.y,e.x,e.y,p.dmg);if((p.skills['다중 사격']||0)>0){for(let i=0;i<Math.min(3,p.skills['다중 사격']);i++)proj(p.x,p.y,e.x+Math.random()*50-25,e.y+Math.random()*50-25,p.dmg*.7)}p.at=p.rate}}for(let e of g.e){let target=Math.hypot(p.x-e.x,p.y-e.y)<170?p:n,a=Math.atan2(target.y-e.y,target.x-e.x),ds=e.spd*dt;e.x+=Math.cos(a)*ds;e.y+=Math.sin(a)*ds;e.cd-=dt;if(Math.hypot(target.x-e.x,target.y-e.y)<e.r+22&&e.cd<=0){if(target===p){p.hp-=e.dmg;if(p.hp<=0){alert('GAME OVER · 플레이어가 쓰러졌습니다');location.reload();return}}else{n.hp-=e.dmg;if(n.hp<=0){alert('GAME OVER · NEXUS가 파괴되었습니다');location.reload();return}}e.cd=e.boss?.7:1.1}}for(let i=g.q.length-1;i>=0;i--){let q=g.q[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0){g.q.splice(i,1);continue}for(let e of g.e){if((q.x-e.x)**2+(q.y-e.y)**2<(e.r+5)**2){hit(e,q.d);g.q.splice(i,1);break}}}for(let i=g.gem.length-1;i>=0;i--){let z=g.gem[i],d=Math.hypot(p.x-z.x,p.y-z.y);if(d<150){let a=Math.atan2(p.y-z.y,p.x-z.x);z.x+=Math.cos(a)*340*dt;z.y+=Math.sin(a)*340*dt}if(d<22){gain(z.v);g.gem.splice(i,1)}}if(n.turret>0){n.cd=(n.cd||0)-dt;if(n.cd<=0){let e=g.e[0];if(e)proj(n.x,n.y,e.x,e.y,18+n.turret*10);n.cd=Math.max(.18,.8-n.turret*.08)}}hud()}function hud(){let p=g.p,n=g.n;$('stage').textContent='STAGE '+(g.stage+1)+' · '+ST[g.stage][0]+' · '+diff;$('time').textContent=String((g.t/60)|0).padStart(2,'0')+':'+String(g.t%60|0).padStart(2,'0');$('ntext').textContent=Math.max(0,n.hp|0)+' / '+(n.max|0);$('nbar').style.width=Math.max(0,n.hp/n.max*100)+'%';$('core').textContent='NEXUS Lv.'+n.lv+' · CORE '+n.core+'/'+n.next;$('pname').textContent=C[cls].n;$('ptext').textContent=Math.max(0,p.hp|0)+' / '+(p.max|0);$('pbar').style.width=Math.max(0,p.hp/p.max*100)+'%';$('xbar').style.width=p.xp/p.nxp*100+'%';$('lvl').textContent='Lv.'+p.l+' · ATK '+(p.dmg|0)+' · KILL '+g.kills;let b=g.e.find(x=>x.boss);if(b){$('btext').textContent=(b.hp|0)+' / '+(b.max|0);$('bbar').style.width=Math.max(0,b.hp/b.max*100)+'%'}}function draw(){ctx.fillStyle=ST[g?.stage||0][2];ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff10';for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(!g)return;let n=g.n,p=g.p;ctx.fillStyle='#55e3cf';ctx.fillRect(n.x-32,n.y-32,64,64);ctx.fillStyle='#c6fff6';ctx.fillRect(n.x-7,n.y-40,14,80);ctx.fillRect(n.x-40,n.y-7,80,14);for(let z of g.gem){ctx.fillStyle='#6bd8ff';ctx.fillRect(z.x-4,z.y-5,8,10)}for(let e of g.e){ctx.fillStyle=e.boss?'#ffbe6b':'#d46e6e';if(e.boss)ctx.fillRect(e.x-32,e.y-32,64,64);else{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill()}}for(let q of g.q){ctx.fillStyle='#d9f4ff';ctx.beginPath();ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle=C[cls].col;ctx.fillRect(p.x-11,p.y-15,22,28);ctx.fillStyle='#eff7ff';ctx.fillRect(p.x-7,p.y-21,14,8)}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyB'&&g&&state==='play'&&!g.boss)spawn(true)});addEventListener('keyup',e=>keys[e.code]=false);function loop(t){let dt=(t-last)/1000;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
