name: Nexus Survival QA

on:
  push:
    branches: [main]
    paths:
      - 'nexus-survival/**'
      - '.github/workflows/nexus-survival-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-survival-qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in nexus-survival/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Game structure QA
        run: node nexus-survival/qa-static.mjs nexus-survival
      - name: Install browser test runtime
        run: npm install --no-save --ignore-scripts puppeteer-core
      - name: Start local game server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory nexus-survival >/tmp/nexus-http.log 2>&1 &
          echo $! >/tmp/nexus-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/nexus-http.log || true
          exit 1
      - name: Local regression + multiplayer smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-browser.mjs 2>&1 | tee /tmp/qa-browser.log
      - name: Upload local regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-browser-log
          path: /tmp/qa-browser.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Local 5-player + boss hierarchy regression
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v24.mjs
      - name: Local buildcraft + synergy QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          sed -i "s/window.NEXUS_RUNTIME_CHECK?.build==='0\.25'/window.NEXUS_RUNTIME_CHECK?.build==='0.32'/" nexus-survival/qa-v25.mjs
          CHROME_BIN="$CHROME_BIN" NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v25.mjs
      - name: Local opening balance + HUD VFX QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v26.mjs
      - name: Local motion + detail QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v27.mjs
      - name: Local party pause + 5-player link QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v28.mjs
      - name: Local unified 5-player transport stress QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v31.mjs
      - name: Local low-lag dual-channel 5-player QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v31-smooth.mjs
      - name: Local 4-player level recovery + pixel asset QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-v32.mjs
      - name: Wait for GitHub Pages build 0.33
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in {1..100}; do
            HTML="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}-${i}" || true)"
            NETWORK="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/game-network-v31.js?v=3102&qa=${GITHUB_SHA}-${i}" || true)"
            SMOOTH="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/game-network-smooth-v31.js?v=3112&qa=${GITHUB_SHA}-${i}" || true)"
            PARTY="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/game-party-sync-v32.js?v=3201&qa=${GITHUB_SHA}-${i}" || true)"
            PIXEL="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/game-pixel-v32.js?v=3201&qa=${GITHUB_SHA}-${i}" || true)"
            VERIFY="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/game-verify-v32.js?v=3201&qa=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'BUILD 0.33' <<<"$HTML" && grep -q 'NEXUS_NETWORK_V31' <<<"$NETWORK" && grep -q 'NEXUS_NETWORK_SMOOTH_V31' <<<"$SMOOTH" && grep -q 'NEXUS_PARTY_SYNC_V32' <<<"$PARTY" && grep -q 'NEXUS_PIXEL_V32' <<<"$PIXEL" && grep -q "build:'0.32'" <<<"$VERIFY"; then
              READY=1
              echo "Live build 0.33 is deployed"
              break
            fi
            echo "Waiting for Pages deployment... ${i}/100"
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo 'GitHub Pages did not expose build 0.33 in time'
            exit 1
          fi
      - name: Live GitHub Pages regression test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-browser.mjs
      - name: Live buildcraft + synergy test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v25.mjs
      - name: Live opening balance + HUD VFX test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v26.mjs
      - name: Live motion + detail test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v27.mjs
      - name: Live party pause + 5-player link test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v28.mjs
      - name: Live unified 5-player transport stress test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v31.mjs
      - name: Live low-lag dual-channel 5-player test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v31-smooth.mjs
      - name: Live 4-player level recovery + pixel asset test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.33' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-v32.mjs
