name: Nexus Survival QA

on:
  push:
    branches: [main]
    paths:
      - 'nexus-survival/**'
      - '.github/workflows/nexus-survival-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in nexus-survival/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Game structure QA
        run: node nexus-survival/qa-static.mjs nexus-survival
      - name: Browser runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium was not found on the runner'
            exit 1
          fi
          python3 -m http.server 4173 --directory nexus-survival >/tmp/nexus-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .25
          done
          CHROME_BIN="$CHROME_BIN" NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-browser.mjs
