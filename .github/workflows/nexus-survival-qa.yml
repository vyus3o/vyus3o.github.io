name: Nexus Survival QA

on:
  push:
    branches: [main]
    paths:
      - 'nexus-survival/**'
      - '.github/workflows/nexus-survival-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-survival-qa-main
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in nexus-survival/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Game structure QA
        run: node nexus-survival/qa-static.mjs nexus-survival
      - name: Browser runtime + multiplayer smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo 'Chrome/Chromium was not found on the runner'
            exit 1
          fi
          python3 -m http.server 4173 --directory nexus-survival >/tmp/nexus-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .25
          done
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.18' NEXUS_QA_URL='http://127.0.0.1:4173/' node nexus-survival/qa-browser.mjs
      - name: Wait for GitHub Pages build 0.18
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in {1..90}; do
            HTML="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}-${i}" || true)"
            SPAWN="$(curl -fsSL "https://vyus3o.github.io/nexus-survival/game-spawn-v18.js?v=18&qa=${GITHUB_SHA}-${i}" || true)"
            if grep -q 'BUILD 0.18' <<<"$HTML" && grep -q "NEXUS_SPAWN_FIX" <<<"$SPAWN"; then
              READY=1
              echo "Live build 0.18 is deployed"
              break
            fi
            echo "Waiting for Pages deployment... ${i}/90"
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo 'GitHub Pages did not expose build 0.18 in time'
            exit 1
          fi
      - name: Live GitHub Pages runtime + multiplayer test
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          CHROME_BIN="$CHROME_BIN" NEXUS_EXPECTED_BUILD='0.18' NEXUS_QA_URL="https://vyus3o.github.io/nexus-survival/?qa=${GITHUB_SHA}" node nexus-survival/qa-browser.mjs
