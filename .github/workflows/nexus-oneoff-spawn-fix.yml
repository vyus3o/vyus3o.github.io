name: Nexus One-off Spawn Timer Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexus-oneoff-spawn-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch spawn timer floor safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('nexus-survival/game-progression-v13.js')
          s=p.read_text(encoding='utf-8')
          old1=""" }
 const out=oldUpdateHost13(dt);
 if(g&&state==='play'){
"""
          new1=""" }
 const beforeNextEnemyId=g?.nextEnemyId||0;
 const out=oldUpdateHost13(dt);
 if(g&&state==='play'){
"""
          old2="  if(!g.boss)g.spawn=Math.max(g.spawn,spawnFloor());"
          new2="  if(!g.boss&&g.nextEnemyId>beforeNextEnemyId)g.spawn=Math.max(g.spawn,spawnFloor());"
          if s.count(old1) != 1:
              raise SystemExit(f'Expected updateHost insertion target once, found {s.count(old1)}')
          if s.count(old2) != 1:
              raise SystemExit(f'Expected spawn floor target once, found {s.count(old2)}')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify syntax and fixed spawn logic
        shell: bash
        run: |
          set -euo pipefail
          node --check nexus-survival/game-progression-v13.js
          grep -F "if(!g.boss&&g.nextEnemyId>beforeNextEnemyId)g.spawn=Math.max(g.spawn,spawnFloor());" nexus-survival/game-progression-v13.js
          ! grep -F "if(!g.boss)g.spawn=Math.max(g.spawn,spawnFloor());" nexus-survival/game-progression-v13.js
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-survival/game-progression-v13.js
          git commit -m 'Fix monster spawn timer floor regression'
          git push origin HEAD:main
