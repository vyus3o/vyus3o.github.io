name: Nexus One-off Class Syntax Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexus-oneoff-class-syntax-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exactly one extra brace
        shell: python
        run: |
          from pathlib import Path
          p=Path('nexus-survival/game-classes-v13.js')
          s=p.read_text(encoding='utf-8')
          old="if(n===2)t._advShockUntil=g.t+3}}}}"
          new="if(n===2)t._advShockUntil=g.t+3}}}"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one syntax target, found {count}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify class syntax
        run: node --check nexus-survival/game-classes-v13.js
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-survival/game-classes-v13.js
          git commit -m 'Fix advanced class syntax error'
          git push origin HEAD:main
